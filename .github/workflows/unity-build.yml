# ─────────────────────────────────────────────────────────────────────────────
# PokemonUnity — Unity 6 CI/CD pipeline
# Triggers on push to main/master and on pull requests.
# Jobs:
#   1. test     — Unity Test Runner (EditMode)
#   2. build-webgl   — WebGL build
#   3. build-android — Android APK (debug)
# Requires repository secrets:
#   UNITY_LICENSE  — contents of Unity licence file (.ulf)
#   UNITY_EMAIL    — Unity account email
#   UNITY_PASSWORD — Unity account password
# ─────────────────────────────────────────────────────────────────────────────
name: Unity CI

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:
    branches: [ main, master ]

env:
  UNITY_VERSION: 6000.0.47f1   # Unity 6.3 LTS

jobs:
  # ── 1. Run EditMode tests ──────────────────────────────────────────────────
  test:
    name: Test (EditMode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Pokemon Unity/Library
          key: library-test-${{ hashFiles('Pokemon Unity/Assets/**', 'Pokemon Unity/Packages/**', 'Pokemon Unity/ProjectSettings/**') }}
          restore-keys: library-test-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:    ${{ env.UNITY_VERSION }}
          projectPath:     "Pokemon Unity"
          testMode:        EditMode
          artifactsPath:   test-results/EditMode
          githubToken:     ${{ secrets.GITHUB_TOKEN }}
          checkName:       EditMode Test Results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-editmode
          path: test-results/

  # ── 2. Build WebGL ─────────────────────────────────────────────────────────
  build-webgl:
    name: Build (WebGL)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Pokemon Unity/Library
          key: library-webgl-${{ hashFiles('Pokemon Unity/Assets/**', 'Pokemon Unity/Packages/**', 'Pokemon Unity/ProjectSettings/**') }}
          restore-keys: library-webgl-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:  ${{ env.UNITY_VERSION }}
          projectPath:   "Pokemon Unity"
          targetPlatform: WebGL
          buildsPath:    builds

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: build-webgl
          path: builds/WebGL
          retention-days: 14

  # ── 3. Build Android (debug) ───────────────────────────────────────────────
  build-android:
    name: Build (Android Debug)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Pokemon Unity/Library
          key: library-android-${{ hashFiles('Pokemon Unity/Assets/**', 'Pokemon Unity/Packages/**', 'Pokemon Unity/ProjectSettings/**') }}
          restore-keys: library-android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:       ${{ env.UNITY_VERSION }}
          projectPath:        "Pokemon Unity"
          targetPlatform:     Android
          androidExportType:  androidPackage
          buildsPath:         builds

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: build-android-apk
          path: builds/Android
          retention-days: 14
